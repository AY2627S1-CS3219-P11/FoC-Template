# Supplier service can be run independently, or included by ../compose.yaml.
services:
  supplier-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-supplier}:${POSTGRES_PASSWORD:-supplier}@supplier-db:5432/${POSTGRES_DB:-supplier}
    ports:
      - "3001:3001"
    depends_on:
      supplier-db:
        condition: service_healthy

  supplier-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supplier}
      POSTGRES_USER: ${POSTGRES_USER:-supplier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supplier}
    volumes:
      - supplier-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  supplier-postgres-data:
