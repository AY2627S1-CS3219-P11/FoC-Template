# Supplier service can be run independently, or included by ../compose.yaml.
services:
  supplier-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in supplier-service/.env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in supplier-service/.env}@ep-odd-mode-az7quoka-pooler.c-3.ap-southeast-1.aws.neon.tech/${POSTGRES_DB:?Set POSTGRES_DB in supplier-service/.env}?sslmode=require&channel_binding=require
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://host.docker.internal:5005}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://admin:admin123@rabbitmq:5672}
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy