# Supplier service can be run independently, or included by ../compose.yaml.
services:
  supplier-service:
    build:
      context: .
    environment:
      DATABASE_URL: ${SUPPLIER_DATABASE_URL:?Set SUPPLIER_DATABASE_URL in the Compose environment}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/foc}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-foc-api}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/foc/protocol/openid-connect/certs}
      RABBITMQ_URL: ${RABBITMQ_URL:?Set RABBITMQ_URL in the Compose environment}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
