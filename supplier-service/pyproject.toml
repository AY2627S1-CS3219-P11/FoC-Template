[project]
name = "supplier-service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.10",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0.53",
    "uvicorn>=0.30",
    "fastapi[standard]>=0.141.1",
    "aio-pika"
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "ruff>=0.9",
    "ty>=0.0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ty.environment]
extra-paths = ["src"]
