[project]
name = "supplier-service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.10",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0.53",
    "uvicorn>=0.30",
    "fastapi[standard]>=0.141.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
