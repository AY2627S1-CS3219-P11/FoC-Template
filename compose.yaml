include:
  - path: ./user-service/compose.yaml
  - path: ./supplier-service/compose.yaml

services:
  ui:
    build:
      context: ./ui
    environment:
      USER_API_UPSTREAM: http://user-service:5005
      SUPPLIER_API_UPSTREAM: http://supplier-service:3001
    ports:
      - "4173:80"
    depends_on:
      user-service:
        condition: service_healthy
      supplier-service:
        condition: service_started

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: foc-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 3

  # Override the standalone supplier service's host-based integration target.
  # supplier-service:
  #   environment:
  #     USER_SERVICE_URL: http://user-service:5005
