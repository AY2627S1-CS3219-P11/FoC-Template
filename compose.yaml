include:
  - path: ./user-service/compose.yaml
  - path: ./supplier-service/compose.yaml
  - path: ./internal-gateway/compose.yaml

services:
  ui:
    build:
      context: ./ui
    environment:
      INTERNAL_GATEWAY_URL: ${INTERNAL_GATEWAY_URL:-http://internal-gateway}
      NGINX_DNS_RESOLVER: ${NGINX_DNS_RESOLVER:-127.0.0.11}
    ports:
      - "4173:80"
    depends_on:
      internal-gateway:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: foc-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 3
