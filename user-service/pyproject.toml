[project]
name = "user-service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.15.1,<3",
    "email-validator>=2,<3",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.8,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "httpx>=0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
