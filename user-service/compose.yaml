# User service can be run independently, or included by ../compose.yaml.
services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "5005:5005"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5005/health', timeout=5)
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
