[project]
name = "order-service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=9,<10",
    "fastapi>=0.115,<1",
    "httpx>=0.28.1,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy[asyncio]==2.0.53",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "ty>=0.0.14",
]

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ty.environment]
extra-paths = ["src"]